name: Cleanup smoke test data

on: workflow_dispatch

concurrency:
  group: cloudflare-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler 3.x locally
        run: npm install --no-audit --no-fund wrangler@^3.90.0

      - name: Patch wrangler.toml with real DB id
        run: sed -i.bak 's/database_id = "REPLACE_AT_DEPLOY_TIME"/database_id = "10175718-c20a-4ac3-8641-3daa1d2e2a77"/' wrangler.toml && rm -f wrangler.toml.bak && grep database_id wrangler.toml

      - name: Delete smoke test user and related rows
        run: |
          SQL="
          DELETE FROM daily WHERE user_id IN (SELECT id FROM users WHERE username='smoke1');
          DELETE FROM events WHERE user_id IN (SELECT id FROM users WHERE username='smoke1');
          DELETE FROM sessions WHERE user_id IN (SELECT id FROM users WHERE username='smoke1');
          DELETE FROM users WHERE username='smoke1';
          SELECT 'remaining smoke1' AS check_, COUNT(*) AS n FROM users WHERE username='smoke1';
          "
          npx wrangler@3 d1 execute cyber-mokugyo --remote --command="$SQL"