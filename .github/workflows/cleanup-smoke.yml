name: Cleanup smoke test data

on: workflow_dispatch

concurrency:
  group: cloudflare-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Delete smoke test user and related rows
        run: |
          SQL="
          DELETE FROM daily WHERE user_id IN (SELECT id FROM users WHERE username='smoke1');
          DELETE FROM events WHERE user_id IN (SELECT id FROM users WHERE username='smoke1');
          DELETE FROM sessions WHERE user_id IN (SELECT id FROM users WHERE username='smoke1');
          DELETE FROM users WHERE username='smoke1';
          SELECT 'remaining smoke1' AS check_, COUNT(*) AS n FROM users WHERE username='smoke1';
          "
          npx wrangler d1 execute cyber-mokugyo --remote --command="$SQL"