name: Deploy backend to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure D1 database exists
        id: d1
        run: bash scripts/ci-d1.sh

      - name: Apply schema migrations
        run: npx wrangler d1 execute cyber-mokugyo --remote --file=drizzle/0000_initial.sql

      - name: Run backend tests
        run: npm test

      - name: Deploy Worker
        id: deploy
        run: bash scripts/ci-deploy.sh

      - name: Health check
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}/api/health"
          echo "GET $URL"
          RESP=$(curl -fsSL -H "Origin: https://liukelly1993-ship-it.github.io" "$URL")
          echo "$RESP"
          echo "$RESP" | grep -qF '"ok":true'

      - name: Notify deploy result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Worker deployed at ${{ steps.deploy.outputs.worker_url }}"
          else
            echo "Deploy failed"
            exit 1
          fi