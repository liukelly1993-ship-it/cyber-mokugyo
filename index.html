function tap(){rollover();const now=performance.now();combo=now-last<2000?combo+1:1;last=now;clearTimeout(comboTimer);comboTimer=setTimeout(()=>{combo=0;$('combo').style.opacity=0;},2000);const {entry:[key,emoji,name],tier,mult,amount}=chooseReward();state.total++;state.today++;cloudTap();state.attrs[key]+=amount;if(!amount)state.blessings++;save();render();tone();animate($('fish'),[{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) translateY(7px) scale(1.025,.955)',offset:.35},{transform:'translateX(-50%) scale(1)'}],{duration:190});animate($('mallet'),[{transform:'rotate(-23deg)'},{transform:'translate(-45px,-58px) rotate(18deg)',offset:.4},{transform:'rotate(-23deg)'}],{duration:210});
const text=`${emoji} ${name}${amount?' +'+fmt(amount):''}${mult>1?' · LUCKY ×'+mult:''}`;const effects=$('effects');while(effects.children.length>=9)effects.firstChild.remove();const el=document.createElement('div');el.className='reward '+tier;el.textContent=text;el.style.setProperty('--dx',(Math.random()*100-50)+'px');el.style.left=(40+Math.random()*20)+'%';effects.append(el);setTimeout(()=>el.remove(),1800);
if(!reduced()){const old=$('scene').querySelectorAll('.ripple');if(old.length>=3)old[0].remove();const ring=document.createElement('div');ring.className='ripple '+tier;$('scene').append(ring);setTimeout(()=>ring.remove(),850);}
if(tier==='epic'||tier==='legendary')animate($('flash'),[{opacity:0},{opacity:1},{opacity:0}],{duration:tier==='legendary'?1600:600});if(tier==='legendary'){$('legend').replaceChildren();const label=document.createElement('small'),strong=document.createElement('strong');label.textContent='✧ 传说好运 · 此刻降临 ✧';strong.textContent=text;$('legend').append(label,strong);if(reduced()){$('legend').style.opacity=1;clearTimeout(window.legendTimer);window.legendTimer=setTimeout(()=>$('legend').style.opacity=0,1800);}else animate($('legend'),[{opacity:0},{opacity:1,offset:.12},{opacity:1,offset:.8},{opacity:0}],{duration:1850});if(state.vibration&&navigator.vibrate)navigator.vibrate(18);}
if(combo>=5){const m=combo>=200?'你已经进入忘我境界':combo>=100?'今日状态拉满':combo>=50?'功德圆满':combo>=20?'心诚则灵':combo>=10?'渐入佳境':'好运正在连连发生';$('combo').innerHTML=`COMBO ×${combo}<small>${m}</small>`;$('combo').style.opacity=1;$('combo').style.transform=`scale(${1+Math.min(combo,200)/1000})`;}
const achievement=milestones.find(([n])=>n===state.total);if(achievement)toast('✦ 成就达成 · '+achievement[1]);}
$('fish').addEventListener('click',tap);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!$('modal').open&&!['INPUT','BUTTON','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();tap();}});$('sound').onclick=()=>{state.sound=!state.sound;save();render();if(state.sound)tone();};
function open(title){$('modal-title').textContent=title;$('modal-body').replaceChildren();if(!$('modal').open)$('modal').showModal();return $('modal-body');}$('close').onclick=()=>$('modal').close();$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close();}});
function fortune(){rollover();if(!state.fortune){state.fortune={date:day(),grade:pick(['大吉','上吉','中吉','小吉']),color:pick(['香槟金','暖杏橙','月光白','松石绿']),number:pick([3,6,8,9]),keyword:pick(['会有意外的小惊喜。','你的认真，正在悄悄开花。','好消息正在向你走来。','今天也有人偷偷欣赏你。']),advice:pick(['大胆一点，你今天运气不错。','给自己一杯好茶，也给好事一点时间。','把心里那个小计划，往前推一点。','和喜欢的人聊聊天，快乐会加倍。'])};save();}const f=state.fortune,body=open('今日运势');body.innerHTML='<div class="fortune"><div class="fortune-date"></div><div class="fortune-grade"></div><div class="fortune-detail" id="f-lucky"></div><div class="fortune-detail" id="f-key"></div><div class="fortune-detail" id="f-advice"></div><p class="explain">一日一签，好运相伴。<br>这是一份轻松的祝福，愿你今天自在欢喜。</p></div>';body.querySelector('.fortune-date').textContent=f.date+' · 今日气运';body.querySelector('.fortune-grade').textContent=f.grade;$('f-lucky').textContent='幸运色：'+f.color+'　·　幸运数字：'+f.number;$('f-key').textContent='今日关键词：'+f.keyword;$('f-advice').textContent='今日建议：'+f.advice;}
$('fortune').onclick=fortune;$('all').onclick=()=>{const body=open('我的运势');body.innerHTML='<div class="all-stats">'+pool.map(([k,e,n])=>`<div class="all-stat">${e} ${n}<b>${fmt(state.attrs[k])}</b></div>`).join('')+'</div><p class="explain">大吉祝福 ×'+state.blessings+'<br>每次敲击随机点亮一项属性，所有加成都在这里。数值仅供娱乐。</p>';};
$('achievements').onclick=()=>{open('一路生花 · 成就').innerHTML=milestones.map(([n,title])=>`<div class="achievement ${state.total>=n?'unlocked':''}"><span>${state.total>=n?'✦':'✧'}</span><div><b>${title}</b><small>${state.total>=n?'已点亮':'正在积攒'} · 累计 ${fmt(n)} 次敲击 · ${fmt(Math.min(state.total,n))} / ${fmt(n)}</small></div></div>`).join('');};
$('settings').onclick=()=>{open('随心设置').innerHTML=`<label class="setting"><span>木鱼音效<small>一声轻响，一点欢喜</small></span><input type="checkbox" id="s-sound" ${state.sound?'checked':''}></label><label class="setting"><span>音量</span><input aria-label="音量" type="range" id="s-volume" min="0" max="1" step=".05" value="${state.volume}"></label><label class="setting"><span>环境动效<small>关闭后保留简洁的文字反馈</small></span><input type="checkbox" id="s-motion" ${state.motion?'checked':''}></label><label class="setting"><span>轻触振动<small>在支持的手机上，传说奖励轻振一下</small></span><input type="checkbox" id="s-vibration" ${state.vibration?'checked':''}></label><p class="explain">好运只增不减，慢慢敲也很好。<br>普通 70% · 稀有 20% · 史诗 8% · 传说 2%。<br>幸运倍率独立抽取：×2 为 6%，×3 为 3%，×5 为 1%，×10 为 0.2%。<br>进度保存在当前浏览器，清理浏览器数据会重新开始。</p>`;for(const key of ['sound','motion','vibration'])$('s-'+key).onchange=e=>{state[key]=e.target.checked;save();render();};$('s-volume').oninput=e=>{state.volume=Number(e.target.value);save();};$('s-volume').onchange=tone;};
$('reset').onclick=()=>{open('开启新的一页').innerHTML='<p class="explain">重新开始会清空累计次数、属性和成就，保留今天的运势签与偏好设置。云端排行榜记录会继续保留。要开启新的一页吗？</p><div class="reset-actions"><button class="pill" id="keep">继续积攒</button><button class="pill primary" id="confirm-reset">确认重新开始</button></div>';$('keep').onclick=()=>$('modal').close();$('confirm-reset').onclick=()=>{const {sound,volume,motion,vibration,fortune}=state;state={...fresh(),sound,volume,motion,vibration,fortune};combo=0;last=0;clearTimeout(comboTimer);clearTimeout(window.legendTimer);$('combo').style.opacity=0;$('effects').replaceChildren();$('legend').getAnimations().forEach(a=>a.cancel());$('legend').style.opacity=0;save();render();$('modal').close();toast('新的一页，好事继续发生。');};};
for(let i=0;i<12;i++){const p=document.createElement('i');p.className='particle';p.style.cssText=`left:${8+Math.random()*84}%;top:${10+Math.random()*80}%;animation-delay:-${Math.random()*8}s`;$('scene').append(p);}render();save();setInterval(()=>{if(state.date!==day())render();},1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_muyu_progress',description:'读取当前木鱼敲击次数与累计正向属性。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw new Error('请传入空对象');rollover();return{today:state.today,total:state.total,attributes:{...state.attrs}};}})).catch(()=>{});}catch{}}
// 账号与云端榜单独立于原有本地属性存档。
const API='https://cyber-mokugyo-api.liukelly1993.chatgpt.site/api';
let session=null,cloudUser=null,cloudBusy=false,draft=null,cloudError='',authMode='login',boardPeriod='today',boardRequest=0;
const memoryQueue=new Map();
try{session=JSON.parse(sessionStorage.getItem('muyu-session-v1'));}catch{}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function keepSession(value){session=value;try{if(value)sessionStorage.setItem('muyu-session-v1',JSON.stringify(value));else sessionStorage.removeItem('muyu-session-v1');}catch{}}
async function api(path,{method='GET',data,token=session?.token}={}){const response=await fetch(API+path,{method,headers:{...(data?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},body:data?JSON.stringify(data):undefined,signal:AbortSignal.timeout(15000)});let value;try{value=await response.json();}catch{throw new Error('云端暂时无法连接，本地敲击照常。');}if(!response.ok){const error=new Error(value.error||'云端正在休息，请稍后重试。');error.status=response.status;throw error;}return value;}
function accountRender(){$('account').textContent=cloudUser?'◉ '+cloudUser.nickname:'◉ 登录 / 注册';$('cloud-status').textContent=cloudUser?`${cloudUser.nickname} · 云端今日 ${fmt(cloudUser.today)} · 总计 ${fmt(cloudUser.total)}${cloudError?' · '+cloudError:''}`:'登录后和好友一起上榜 · 本地好运照常积攒';}
function queued(){if(!session)return[];const prefix='muyu-taps-v1:'+session.userId+':',map=new Map();try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(prefix)){try{const b=JSON.parse(localStorage.getItem(k));if(b&&b.userId===session.userId&&Number.isInteger(b.count)&&b.count>0)map.set(k,b);}catch{}}}}catch{}for(const [k,b]of memoryQueue)if(k.startsWith(prefix))map.set(k,b);return [...map.entries()].sort((a,b)=>a[1].id.localeCompare(b[1].id));}
function persistBatch(batch){const k='muyu-taps-v1:'+batch.userId+':'+batch.id;memoryQueue.set(k,batch);try{localStorage.setItem(k,JSON.stringify(batch));}catch{cloudError='请保持页面开启以完成同步';}return k;}
function cloudTap(){if(!session||!cloudUser)return;if(!draft||draft.userId!==session.userId||draft.count>=120)draft={userId:session.userId,id:Date.now()+'-'+crypto.randomUUID(),count:0};draft.count++;persistBatch(draft);if(draft.count>=100)void flushCloud();}
async function flushCloud(){if(cloudBusy||!session||!cloudUser)return;cloudBusy=true;const owner=session.userId,token=session.token;draft=null;try{const batchList=queued();for(const [key,b] of batchList.slice(0,10)){if(session?.userId!==owner)break;try{const res=await api('/taps',{method:'POST',token,data:{id:b.id,count:b.count}});memoryQueue.delete(key);try{localStorage.removeItem(key);}catch{}if(session?.userId===owner){cloudUser=res.user;cloudError='';}}catch(e){if(e.status===422){memoryQueue.delete(key);try{localStorage.removeItem(key);}catch{}cloudError='超时离线记录保留在本地';continue;}throw e;}}}catch(e){if(e.status===401){keepSession(null);cloudUser=null;}cloudError=e.status===401?'请重新登录以继续同步':'待同步，联网后自动继续';}finally{cloudBusy=false;accountRender();}}
function accountOpen(mode='login'){authMode=mode;if(cloudUser){open('我的账号').innerHTML=`<div class="account-card"><div class="account-avatar">${esc(cloudUser.nickname.slice(0,1))}</div><h3>${esc(cloudUser.nickname)}</h3><p class="explain">账号：${esc(cloudUser.username)}</p><div class="cloud-numbers"><div>今日敲击<strong>${fmt(cloudUser.today)}</strong></div><div>累计敲击<strong>${fmt(cloudUser.total)}</strong></div></div></div><p class="explain">云端榜单从登录后开始积攒，使用北京时间。游戏名和敲击次数对已登录玩家可见。<br>本地属性、运势和成就继续保留在当前浏览器。</p><div class="reset-actions"><button class="pill primary" id="account-board">看看排行榜</button><button class="pill" id="logout">退出登录</button></div><p id="account-message" class="form-message" role="status"></p>`;$('account-board').onclick=()=>showBoard();$('logout').onclick=async()=>{const button=$('logout');button.disabled=true;await flushCloud();if(cloudBusy||queued().length){$('account-message').textContent='还有敲击待同步，请联网同步完成后再退出。';button.disabled=false;return;}try{await api('/logout',{method:'POST',data:{}});}catch(e){if(e.status!==401){$('account-message').textContent='请联网后再退出，以便结束云端登录。';button.disabled=false;return;}}keepSession(null);cloudUser=null;draft=null;accountRender();$('modal').close();toast('已退出，仍然可以自在敲木鱼。');};return;}
open(mode==='register'?'注册 · 一起积攒好运':'欢迎回来').innerHTML=`<form id="auth-form"><label class="auth-field">账号<input name="username" id="auth-username" autocomplete="username" placeholder="3–20 位字母、数字或下划线" pattern="[A-Za-z0-9_]{3,20}" minlength="3" maxlength="20" required></label>${mode==='register'?'<label class="auth-field">游戏名<input id="auth-nickname" name="nickname" autocomplete="nickname" placeholder="排行榜展示的名字，1–16 个字符" maxlength="16" required></label>':''}<label class="auth-field">密码<input type="password" id="auth-password" name="password" autocomplete="${mode==='register'?'new-password':'current-password'}" placeholder="至少 8 位，请记好你的密码" minlength="8" maxlength="72" required></label>${mode==='register'?'<label class="auth-field">确认密码<input type="password" id="auth-confirm" autocomplete="new-password" minlength="8" maxlength="72" required></label>':''}<p class="form-message" id="auth-message" role="status"></p><button type="submit" class="pill primary auth-submit">${mode==='register'?'注册并开始积攒':'登录'}</button></form><button class="auth-switch" id="auth-switch">${mode==='register'?'已有账号？去登录':'还没有账号？注册一个'}</button><p class="explain">无需邮箱。请记好账号、密码和游戏名，这一版暂不提供密码找回。<br>注册后，游戏名与云端敲击次数会展示给其他已登录玩家。游客期间的本地记录不计入榜单。</p>`;
$('auth-switch').onclick=()=>accountOpen(mode==='register'?'login':'register');$('auth-form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button[type=submit]');const username=$('auth-username').value.trim(),password=$('auth-password').value;if(mode==='register'&&password!==$('auth-confirm').value){$('auth-message').textContent='两次密码请填写一致。';return;}button.disabled=true;$('auth-message').textContent='正在连接云端…';try{const res=await api('/'+mode,{method:'POST',token:null,data:{username,password,...(mode==='register'?{nickname:$('auth-nickname').value.trim()}: {})}});keepSession({token:res.token,userId:res.user.id});cloudUser=res.user;cloudError='';accountRender();$('modal').close();toast('欢迎 '+cloudUser.nickname+'，一起积攒好运。');void flushCloud();}catch(err){if($('auth-message'))$('auth-message').textContent=err.message;}finally{button.disabled=false;}};
}
async function showBoard(period=boardPeriod){boardPeriod=period;if(!session||!cloudUser){accountOpen();return;}const request=++boardRequest;open('万事皆涨 · 排行榜').innerHTML=`<div class="board-tabs"><button class="pill ${period==='today'?'primary':''}" id="board-today">今日榜</button><button class="pill ${period==='total'?'primary':''}" id="board-total">总榜</button><button class="pill" id="board-refresh" aria-label="刷新排行榜">↻</button></div><p class="board-note">${period==='today'?'每日北京时间 00:00 开启新一轮':'记录登录后积攒的每一次敲击'} · 每 15 秒更新</p><div id="board-data" role="status">正在接住大家的好运…</div>`;$('board-today').onclick=()=>showBoard('today');$('board-total').onclick=()=>showBoard('total');$('board-refresh').onclick=()=>showBoard(boardPeriod);await flushCloud();try{const b=await api('/leaderboard?period='+period);if(request!==boardRequest||!$('board-data'))return;$('board-data').innerHTML=`<div class="my-ranking"><span>我的排名 <b>${b.me.score?'#'+b.me.rank:'待上榜'}</b></span><span>${fmt(b.me.score)} 次</span></div><div class="board-list">${b.rows.map(r=>`<div class="board-row ${r.id===b.me.id?'is-me':''}"><span class="rank-number">${r.position<=3?['🥇','🥈','🥉'][r.position-1]:'#'+r.position}</span><span class="rank-name">${esc(r.nickname)}${r.id===b.me.id?' <small>我</small>':''}</span><strong>${fmt(r.score)}<small> 次</small></strong></div>`).join('')}</div><p class="board-note">${b.participants} 位好友一起积攒 · 展示前 50 位<br>云端累计与本地属性独立，重置本地数据不会清空榜单。</p>`;}catch(e){if(request===boardRequest&&$('board-data'))$('board-data').textContent=e.message;}}
$('account').onclick=()=>accountOpen();$('leaderboard').onclick=()=>showBoard();accountRender();if(session)api('/me').then(({user})=>{cloudUser=user;accountRender();void flushCloud();}).catch(e=>{if(e.status===401)keepSession(null);cloudError='请联网后重新登录';accountRender();});
setInterval(()=>{void flushCloud();if($('modal').open&&$('board-data'))void showBoard(boardPeriod);},15000);setInterval(()=>void flushCloud(),3000);window.addEventListener('online',()=>void flushCloud());document.addEventListener('visibilitychange',()=>{if(document.hidden)void flushCloud();});
})();
</script></body></html>
